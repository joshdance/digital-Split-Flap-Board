<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Split-Flap Board</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <h1>Split-Flap Board</h1>

        <div class="input-section">
            <input type="text" id="textInput" placeholder="Enter text to display..." maxlength="20">
            <button id="displayBtn">Display</button>
        </div>

        <div id="board" class="board">
            <!-- Flap displays will be generated here -->
        </div>

        <div class="controls">
            <label>
                <input type="checkbox" id="soundToggle" checked>
                Sound Effects
            </label>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
